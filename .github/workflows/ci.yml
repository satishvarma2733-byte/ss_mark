# CI for Milestone 1. Not executed yet: it runs only after the repository is hosted on GitHub with this folder as the root.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: build-kit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: build-kit/.nvmrc
          cache: pnpm
          cache-dependency-path: build-kit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @simply-sit/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
