# CI for the Simply Sit build kit. This folder is the repository root (satishvarma2733-byte/ss_mark).
# The local Supabase stack runs inside the job (Docker on the runner), MOCK providers only; no secrets are used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      # Local Supabase (migrations + seed), then the git-ignored .env.local files the app and tests read. These come
      # before the build because Next.js bakes NEXT_PUBLIC_* values in at build time.
      - run: pnpm db:start
      - run: pnpm env:local
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @simply-sit/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
